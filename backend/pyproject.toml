[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge-backend"
version = "0.1.0"
description = "Backend foundation for an AI-powered dynamic dashboard system"
readme = {text = "InsightForge backend service.", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=50.0.2,<51",
  "fastapi>=0.115,<1",
  "langchain-core>=1.0,<2",
  "langchain-groq>=1.0,<2",
  "langchain-openai>=1.7.4,<2",
  "langchain-anthropic>=1.7.10,<2",
  "langgraph>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlglot>=26,<30",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ops = ["bcrypt>=4,<6"]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests requiring a running PostgreSQL instance",
]

[tool.ruff]
exclude = ["build"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
